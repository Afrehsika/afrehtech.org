<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="blueCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0B1220"/>
  <!-- Outer glowing circle -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#blueCyanGrad)" stroke-width="4.5" filter="url(#glow)"/>
  
  <!-- Circuit Nodes & Branches -->
  <path d="M 38 60 C 38 48 48 38 58 36" fill="none" stroke="url(#blueCyanGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 48 L 50 28" fill="none" stroke="url(#blueCyanGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 54 50 L 68 42" fill="none" stroke="url(#blueCyanGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 52 58 L 72 58" fill="none" stroke="url(#blueCyanGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Terminal Nodes -->
  <circle cx="50" cy="26" r="4.5" fill="#38BDF8" stroke="#0B1220" stroke-width="2"/>
  <circle cx="60" cy="35" r="4" fill="#06B6D4" stroke="#0B1220" stroke-width="2"/>
  <circle cx="70" cy="42" r="4" fill="#38BDF8" stroke="#0B1220" stroke-width="2"/>
  <circle cx="74" cy="58" r="4" fill="#2563EB" stroke="#0B1220" stroke-width="2"/>
  
  <!-- Power Emblem on the left -->
  <path d="M 32 44 A 14 14 0 1 0 44 54" fill="none" stroke="url(#blueCyanGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="38" y1="36" x2="38" y2="48" stroke="url(#blueCyanGrad)" stroke-width="4" stroke-linecap="round"/>
</svg>
